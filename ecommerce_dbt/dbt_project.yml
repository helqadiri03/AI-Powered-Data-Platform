# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models.
name: 'ecommerce_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'ecommerce_dbt'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# ---------------------------------------------------------------------------
# Model configurations
# ---------------------------------------------------------------------------
# ELT Architecture — three transformation layers above the RAW landing zone:
#
#   RAW (source) → STAGING (views) → INTERMEDIATE (views) → MARTS (tables)
#
# The RAW schema is populated by the Airflow ELT pipeline; all other schemas
# are owned and managed exclusively by dbt.
# ---------------------------------------------------------------------------
models:
  ecommerce_dbt:
    staging:
      +schema: STAGING
      +materialized: view
    intermediate:
      +schema: INTERMEDIATE
      +materialized: view
    marts:
      +schema: MARTS
      +materialized: table
